name: Flutter Build and Release

on:
  push:
    tags:
      - 'develop-*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/develop-')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache Flutter SDK
        uses: actions/cache@v3
        with:
          path: ~/.cache/flutter
          key: ${{ runner.os }}-flutter-sdk-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-sdk-

      - name: Cache Pub dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev build-essential

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Verify Linux build output
        run: ls -la build/linux/x64/release/bundle/

      - name: Archive Linux build
        run: zip -r linux-build.zip build/linux/x64/release/bundle/

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: linux-build
          path: linux-build.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/develop-')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache Flutter SDK
        uses: actions/cache@v3
        with:
          path: C:\Users\runneradmin\AppData\Local\flutter
          key: ${{ runner.os }}-flutter-sdk-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-sdk-

      - name: Cache Pub dependencies
        uses: actions/cache@v3
        with:
          path: C:\Users\runneradmin\AppData\Roaming\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --verbose

      - name: Verify Windows build output
        run: |
          if (Test-Path "build/windows/x64/runner/Release/") {
            Get-ChildItem -Path "build/windows/x64/runner/Release/" -Recurse
          } else {
            Write-Host "Build output directory does not exist."
            Exit 1
          }

      - name: Archive Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-build.zip

      - name: Verify Windows build archive
        run: |
          if (Test-Path "windows-build.zip") {
            Write-Host "Archive exists."
          } else {
            Write-Host "Archive does not exist."
            Exit 1
          }

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-build
          path: windows-build.zip

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/develop-')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Flutter SDK
        uses: actions/cache@v3
        with:
          path: ~/.cache/flutter
          key: ${{ runner.os }}-flutter-sdk-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-sdk-

      - name: Cache Pub dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          cache: true

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build 

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/app-release.apk

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/develop-')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION=${VERSION%%+*}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: linux-build
          path: ./linux-build
      - uses: actions/download-artifact@v3
        with:
          name: windows-build
          path: ./windows-build
      - uses: actions/download-artifact@v3
        with:
          name: android-build
          path: ./android-build

      - name: Create Release and Upload Assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: "Release of version ${{ env.VERSION }}"
          allowUpdates: true
          replacesArtifacts: false
          artifacts: |
            ./linux-build/linux-build.zip
            ./windows-build/windows-build.zip
            ./android-build/app-release.apk